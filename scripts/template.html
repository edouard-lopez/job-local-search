<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offres locales autour d'Orx</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { darkMode: "media" };</script>
<style type="text/tailwindcss">
  @layer components {
    .chip { @apply inline-flex items-center rounded-full px-2.5 py-0.5 text-xs ring-1 ring-inset cursor-pointer select-none; }
    .tag  { @apply inline-flex items-center rounded px-1.5 py-px text-[11.5px] ring-1 ring-inset; }
    .known   { @apply bg-emerald-50 text-emerald-900 ring-emerald-600/40 dark:bg-emerald-950 dark:text-emerald-100 dark:ring-emerald-400/40; }
    .unknown { @apply bg-white text-gray-800 ring-gray-500/50 dark:bg-gray-900 dark:text-gray-300; }
    .chip[aria-pressed="true"] { @apply bg-emerald-700 text-white ring-emerald-700 opacity-100; }
    .ico { @apply inline-flex h-8 w-8 items-center justify-center rounded-md text-gray-500 ring-1 ring-inset ring-gray-300 bg-white hover:text-gray-900 hover:ring-gray-500 dark:bg-gray-900 dark:ring-gray-700 dark:text-gray-400 dark:hover:text-gray-100; }
    .ico[aria-pressed="true"] { @apply text-gray-900 ring-gray-600 bg-gray-100 dark:text-white dark:bg-gray-800; }
    .ico svg { @apply h-4 w-4; }
  }
</style>
</head>
<body class="bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100 text-sm">
<header class="flex items-center justify-between gap-4 border-b border-gray-200 dark:border-gray-800 px-4 py-3">
  <div class="min-w-0">
    <h1 class="text-lg font-semibold">Offres informatique autour d'Orx</h1>
    <p class="text-xs text-gray-500">La liste suit la zone visible de la carte. Cliquez une offre pour voir l'itinéraire.</p>
  </div>
  <a id="btnUpdate" target="_blank" rel="noopener" class="shrink-0 inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm ring-1 ring-inset ring-gray-300 hover:ring-gray-500 dark:ring-gray-700" title="Lance le workflow de mise à jour sur GitHub">
    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    <span class="sr-only sm:not-sr-only">Mettre à jour les offres</span><span class="sr-only"> (ouvre GitHub dans un nouvel onglet)</span>
  </a>
</header>
<main class="grid md:grid-cols-[minmax(320px,42%)_1fr] md:h-[calc(100vh-66px)]">
  <div id="map" class="h-[55vh] md:h-full" role="region" aria-label="Carte des offres (OpenStreetMap)"></div>
  <section class="overflow-auto px-4 py-3 md:border-l border-gray-200 dark:border-gray-800">
    <div class="flex flex-col gap-2 mb-3">
      <h2 class="text-xs font-semibold uppercase tracking-wide text-gray-500">Type de contrat</h2>
      <div class="flex flex-wrap gap-1.5" id="fContrat" role="group" aria-label="Filtrer par type de contrat"></div>
      <h2 class="text-xs font-semibold uppercase tracking-wide text-gray-500 mt-1">Technos</h2>
      <div class="flex flex-wrap gap-1.5" id="fTech" role="group" aria-label="Filtrer par techno"></div>
      <label class="mt-1 text-xs font-semibold uppercase tracking-wide text-gray-500"><input type="checkbox" id="fZone"> Masquer la zone Lasseube/Pau</label>
    </div>
    <div class="text-gray-500 my-2" id="count" role="status" aria-live="polite"></div>
    <h2 class="sr-only">Offres</h2>
    <ul id="list" class="flex flex-col gap-2.5"></ul>
  </section>
</main>
<script>
const OFFRES = /*__DATA__*/[];
const KNOWN = new Set(/*__KNOWN__*/[].map(t=>t.toLowerCase()));
const isKnown = t => KNOWN.has(t.toLowerCase()) || t.split("/").some(x=>KNOWN.has(x.trim().toLowerCase()));
const kcls = t => isKnown(t) ? "known" : "unknown";
const sortTech = a => [...a].sort((x,y)=>(isKnown(y)-isKnown(x))||x.localeCompare(y,"fr",{sensitivity:"base"}));
const svg = d => `<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  star: svg('<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'),
  x:    svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  pen:  svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  code: svg('<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>'),
  fork: svg('<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"/><path d="m18 15-2-2"/><path d="m15 18-2-2"/>'),
  bike: svg('<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/>'),
  car:  svg('<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2.7-3.6A2 2 0 0 0 13.7 6H7.6a2 2 0 0 0-1.7 1L4 10l-1.6.6A2 2 0 0 0 1 12.5V16c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>'),
  ruler:svg('<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2"/>'),
};
let focused = null, routeLayer = null, routeInfo = "";
function showRouteInfo(){ const el=list.querySelector(`[data-id="${focused}"] .route`); if(el){el.hidden=!routeInfo;el.textContent=routeInfo;} }
async function focusOffer(id){
  const o = OFFRES.find(x=>x.id===id); if(!o) return;
  focused = id; routeInfo = "Calcul de l'itinéraire…";
  const bike = o.distance_km < 20;
  render();
  if(routeLayer){ routeLayer.remove(); routeLayer=null; }
  try{
    const prof = bike ? "routed-bike" : "routed-car";
    const r = await fetch(`https://routing.openstreetmap.de/${prof}/route/v1/driving/${ORX[1]},${ORX[0]};${o.lon},${o.lat}?overview=full&geometries=geojson`);
    const j = await r.json(); const rt = j.routes[0];
    routeLayer = L.geoJSON(rt.geometry,{style:{color:bike?"#16a34a":"#2563eb",weight:5,opacity:.8}}).addTo(map);
    const km = rt.distance/1000, min = bike ? km/20*60 : rt.duration/60;
    routeInfo = `${bike?"Vélo":"Voiture"} : ${km.toFixed(1)} km, ~${Math.round(min)} min (itinéraire OpenStreetMap${bike?", 20 km/h":""})`;
    map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});
  }catch(e){
    routeInfo = "Itinéraire indisponible : distances estimées affichées."; map.setView([o.lat,o.lon],13);
  }
  showRouteInfo();
}
let triage = {};
try { triage = JSON.parse(localStorage.getItem("triage")||"{}"); } catch(e) {}
// ⭐ : marque « À creuser ». ❌ : retire « À creuser », sinon exclut.
function setTriage(lien, v){
  if (v==="out" && triage[lien]==="dig") triage[lien] = undefined;
  else triage[lien] = v;
  try { localStorage.setItem("triage", JSON.stringify(triage)); } catch(e) {} render(); }
const REPO = location.hostname.endsWith("github.io")
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}` : "edouard-lopez/job-local-search";
const WF = f => `https://github.com/${REPO}/actions/workflows/${f}`;
const ORX = [43.6036, -1.3767];
const cat = c => /CDI/i.test(c) ? "CDI" : /CDD/i.test(c) ? "CDD" : /intérim/i.test(c) ? "Intérim" :
  /fonction/i.test(c) ? "Fonction publique" : /freelance/i.test(c) ? "Freelance" : /altern|apprent/i.test(c) ? "Alternance" : "Autre";
const state = {contrat:new Set(), tech:new Set()};
const map = L.map("map").setView([43.5,-1.3], 9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© contributeurs OpenStreetMap"}).addTo(map);
L.circleMarker(ORX,{radius:8,color:"#c0392b",fillOpacity:.9}).addTo(map).bindTooltip("Orx (domicile)");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const markers = OFFRES.map(o => L.marker([o.lat,o.lon]).bindPopup(
  `<b>${esc(o.poste)}</b><br>${esc(o.entite)}<br>${esc(o.commune)} · ${esc(o.contrat)}<br><a href="${o.lien}" target="_blank" rel="noopener">Annonce</a>`));
function chips(el, values, set, counts, tech){
  values.forEach(v=>{const b=document.createElement("button");
    b.className="chip "+(tech?kcls(v):"known");b.textContent=`${v} (${counts[v]})`;b.setAttribute("aria-label",`${v}, ${counts[v]} offre(s)${tech?(isKnown(v)?", déjà utilisée":", inconnue"):""}`);b.setAttribute("aria-pressed","false");
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.setAttribute("aria-pressed",set.has(v));render();};el.appendChild(b);});
}
const contratCount={};OFFRES.forEach(o=>{const c=cat(o.contrat);contratCount[c]=(contratCount[c]||0)+1;});
chips(fContrat,Object.keys(contratCount).sort(),state.contrat,contratCount,false);
const techCount={};OFFRES.forEach(o=>o.technos.forEach(t=>techCount[t]=(techCount[t]||0)+1));
chips(fTech,sortTech(Object.keys(techCount)),state.tech,techCount,true);
fZone.onchange=render; map.on("moveend",render);
const good = ok => ok ? "font-semibold text-emerald-700 dark:text-emerald-400" : "";
function card(o){
  const t=triage[o.lien], dig=t==="dig", out=t==="out";
  const ent=o.entite.split(/\s+/), short=ent.length>3?ent.slice(0,3).join(" ")+"…":o.entite;
  const L_=esc(o.lien), name=esc(o.poste);
  const starBtn = `<button class="ico" data-l="${L_}" data-v="dig" title="Marquer À creuser" aria-label="Marquer « ${name} » À creuser">${ICON.star}</button>`;
  const penBtn  = `<a class="ico" href="${WF("generate-application.yml")}" target="_blank" rel="noopener" title="Générer un CV personnalisé (markdown) : offre n° ${o.id}" aria-label="Générer un CV personnalisé pour « ${name} », offre n° ${o.id} (ouvre GitHub)">${ICON.pen}</a>`;
  const xLabel  = dig ? "Retirer de À creuser" : "Marquer comme exclue";
  const xBtn    = `<button class="ico absolute bottom-2 right-2" data-l="${L_}" data-v="out" title="${xLabel}" aria-label="${xLabel} : « ${name} »">${ICON.x}</button>`;
  const status  = dig ? "À creuser. " : out ? "Exclue. " : "";
  return `<article data-id="${o.id}" tabindex="0" aria-label="${status}${name}, ${esc(o.entite)}, ${esc(o.commune)}. Entrée : voir l'itinéraire."
      class="relative cursor-pointer rounded-lg border border-gray-200 dark:border-gray-800 px-3 py-2.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600
      ${dig?"border-l-4 border-l-blue-600":""} ${out?"opacity-50 py-1.5":""} ${o.id===focused?"ring-2 ring-emerald-600":""}">
    <div class="flex items-start gap-2">
      <div class="flex-1 min-w-0">
        <h3 class="text-[15px] font-semibold leading-snug">
          ${dig?`<span class="text-blue-600" aria-hidden="true">★</span><span class="sr-only">À creuser : </span> `:""}${out?`<span class="sr-only">Exclue : </span>`:""}<a class="text-emerald-800 underline decoration-emerald-600/60 decoration-2 underline-offset-2 hover:text-emerald-600 hover:decoration-emerald-600 dark:text-emerald-300" href="${o.lien}" target="_blank" rel="noopener">${name}<span class="sr-only"> (annonce, nouvel onglet)</span></a>
          <span class="whitespace-nowrap text-xs font-normal text-gray-500"><span aria-hidden="true">· </span><span class="sr-only">publiée le </span><time datetime="${esc(o.publie)}">${esc(o.publie)}</time></span>
        </h3>
        <div class="text-[12.5px] text-gray-500">${ent.length>3?`<abbr class="cursor-help" title="${esc(o.entite)}" aria-hidden="true">${esc(short)}</abbr><span class="sr-only">${esc(o.entite)}</span>`:esc(o.entite)} · ${esc(o.commune)} · ${esc(o.secteur)} · <b class="text-gray-700 dark:text-gray-300">${esc(o.contrat)}</b></div>
      </div>
      <div class="shrink-0">${dig?penBtn:starBtn}</div>
    </div>
    ${out?"":`
    <ul class="flex flex-wrap items-center gap-x-3 my-1.5 text-[12.5px]">
      <li class="inline-flex items-center gap-1" title="Score techno"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.code}</span><span class="sr-only">Score techno :</span> <span class="${good(o.score_techno>=3)}">${o.score_techno}/5</span></li>
      <li class="inline-flex items-center gap-1" title="Score logiciel libre"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.fork}</span><span class="sr-only">Score logiciel libre :</span> <span class="${good(o.score_libre>=3)}">${o.score_libre}/5</span></li>
      <li class="inline-flex items-center gap-1" title="Vélo"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.bike}</span><span class="sr-only">Vélo :</span> <span class="${good(o.velo_min<30)}">~${o.velo_min} min</span></li>
      <li class="inline-flex items-center gap-1" title="Voiture"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.car}</span><span class="sr-only">Voiture :</span> <span class="${good(o.voiture_min<30)}">~${o.voiture_min} min</span></li>
      <li class="inline-flex items-center gap-1" title="Distance"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.ruler}</span><span class="sr-only">Distance :</span> ${o.distance_km} km</li>
    </ul>
    <details><summary class="cursor-pointer text-emerald-700 dark:text-emerald-400">Mission</summary><p class="mt-1">${esc(o.mission)}</p></details>
    <h4 class="sr-only">Technos</h4>
    <ul class="flex flex-wrap gap-1 mt-1.5 pr-10">${sortTech(o.technos).map(t=>`<li class="tag ${kcls(t)}">${esc(t)}<span class="sr-only">${isKnown(t)?" (déjà utilisée)":" (inconnue)"}</span></li>`).join("")}</ul>
    ${o.email||o.telephone?`<div class="text-[12.5px] text-gray-500 mt-1.5">${esc(o.email||"")}${o.email&&o.telephone?" · ":""}${esc(o.telephone||"")}</div>`:""}
    <div class="route text-[12.5px] text-emerald-700 dark:text-emerald-400 mt-1.5 pr-10" role="status" aria-live="polite" hidden></div>
    ${xBtn}`}
  </article>`;
}
function render(){
  const bounds=map.getBounds(); const shown=[];
  OFFRES.forEach((o,i)=>{
    const ok=(!state.contrat.size||state.contrat.has(cat(o.contrat)))
      &&(!state.tech.size||o.technos.some(t=>state.tech.has(t)))
      &&!(fZone.checked&&o.zone.startsWith("Lasseube"));
    ok?markers[i].addTo(map):markers[i].remove();
    if(ok&&bounds.contains([o.lat,o.lon]))shown.push(o);
  });
  shown.sort((a,b)=>String(b.publie||"").localeCompare(String(a.publie||"")));
  count.textContent=`${shown.length} offre(s) dans la zone visible`;
  list.innerHTML=shown.map(o=>`<li>${card(o)}</li>`).join("");
  list.querySelectorAll("button[data-v]").forEach(b=>b.onclick=e=>{e.stopPropagation();setTriage(b.dataset.l,b.dataset.v);});
  list.querySelectorAll("article").forEach(c=>{
    c.onclick=e=>{if(e.target.closest("a,button,summary,abbr"))return;focusOffer(+c.dataset.id);};
    c.onkeydown=e=>{if(e.target===c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();focusOffer(+c.dataset.id);}};
  });
  if(focused){const f=list.querySelector(`article[data-id="${focused}"]`); if(f&&document.activeElement?.tagName!=="BUTTON") f.focus({preventScroll:true});}
  if(focused)showRouteInfo();
}
btnUpdate.href=WF("update-offers.yml");
render();
</script>
</body>
</html>
