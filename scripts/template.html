<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offres locales autour d'Orx</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1d2329;--mut:#5b6670;--line:#dde2e6;--acc:#1f6f5c;--chip:#eef3f1}
@media (prefers-color-scheme:dark){:root{--bg:#15191c;--fg:#e6eaed;--mut:#9aa6b0;--line:#2c3439;--acc:#5cc3a6;--chip:#1f2a27}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 4px}
header p{margin:0;color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:minmax(320px,42%) 1fr;height:calc(100vh - 64px)}
#map{height:100%;min-height:320px}
#side{overflow:auto;padding:12px 16px;border-left:1px solid var(--line)}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
label.b{font-weight:600;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.count{color:var(--mut);margin:6px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:15px}
.meta{color:var(--mut);font-size:12.5px}
.scores{display:flex;gap:10px;margin:6px 0;font-size:12.5px}
.scores b{color:var(--acc)}
details summary{cursor:pointer;color:var(--acc)}
a{color:var(--acc)}
.tech{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tech span{border-radius:4px;padding:1px 6px;font-size:11.5px}
.known{background:var(--chip);border:1px solid var(--acc)}
.unknown{background:transparent;border:1px dashed var(--mut);color:var(--mut)}
.chip.unknown{border-style:dashed}
.card.dig{border-left:4px solid #2563eb}
.card.out{opacity:.45;padding:6px 12px}
.card.out details,.card.out .tech,.card.out .scores{display:none}
.star{color:#2563eb}
.head{display:flex;gap:8px;align-items:flex-start}
.titles{flex:1;min-width:0}
.card h3 a{color:var(--fg);text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.date{white-space:nowrap;font-weight:400;font-size:12.5px;color:var(--mut)}
abbr{text-decoration:underline dotted;cursor:help}
.acts{display:flex;gap:4px;flex-shrink:0}
.ico{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;text-decoration:none;opacity:.55}
.ico:hover,.ico[aria-pressed=true]{opacity:1;border-color:var(--acc)}
.ico[aria-pressed=true]{background:var(--chip)}
.card{cursor:pointer}
.card.focused{box-shadow:0 0 0 2px var(--acc)}
.route{font-size:12.5px;color:var(--acc);margin-top:6px}
.card.out .acts{opacity:1}
.legend{font-size:12px;color:var(--mut)}
.wrap{overflow-x:auto}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}#map{height:55vh}#side{border-left:0}}
</style>
</head>
<body>
<header>
<h1>Offres informatique autour d'Orx</h1>
<p>La liste suit la zone visible de la carte. Distances et durées sont des estimations (voir README).</p>
</header>
<main>
<div id="map"></div>
<section id="side">
<div class="filters">
<label class="b">Type de contrat</label><div class="chips" id="fContrat"></div>
<label class="b">Technos</label><span class="legend">plein = déjà utilisée · pointillés = inconnue</span><div class="chips" id="fTech"></div>
<a class="chip" id="btnUpdate" target="_blank" rel="noopener">↻ Mettre à jour les offres</a>
<label class="b"><input type="checkbox" id="fZone"> Masquer la zone Lasseube/Pau</label>
</div>
<div class="count" id="count"></div>
<div id="list"></div>
</section>
</main>
<script>
const OFFRES = /*__DATA__*/[];
const KNOWN = new Set(/*__KNOWN__*/[].map(t=>t.toLowerCase()));
const isKnown = t => KNOWN.has(t.toLowerCase()) || t.split("/").some(x=>KNOWN.has(x.trim().toLowerCase()));
const kcls = t => isKnown(t) ? "known" : "unknown";
const sortTech = a => [...a].sort((x,y)=>(isKnown(y)-isKnown(x))||x.localeCompare(y,"fr",{sensitivity:"base"}));
let focused = null, routeLayer = null, routeInfo = "";
function showRouteInfo(){ const el=list.querySelector(`.card[data-id="${focused}"] .route`); if(el){el.hidden=!routeInfo;el.textContent=routeInfo;} }
async function focusOffer(id){
  const o = OFFRES.find(x=>x.id===id); if(!o) return;
  focused = id; routeInfo = "Calcul de l'itinéraire…";
  const bike = o.distance_km < 20;
  render();
  if(routeLayer){ routeLayer.remove(); routeLayer=null; }
  try{
    const prof = bike ? "routed-bike" : "routed-car";
    const r = await fetch(`https://routing.openstreetmap.de/${prof}/route/v1/driving/${ORX[1]},${ORX[0]};${o.lon},${o.lat}?overview=full&geometries=geojson`);
    const j = await r.json(); const rt = j.routes[0];
    routeLayer = L.geoJSON(rt.geometry,{style:{color:bike?"#16a34a":"#2563eb",weight:5,opacity:.8}}).addTo(map);
    const km = rt.distance/1000, min = bike ? km/20*60 : rt.duration/60;
    routeInfo = `${bike?"🚲 Vélo":"🚗 Voiture"} : ${km.toFixed(1)} km, ~${Math.round(min)} min (itinéraire OpenStreetMap${bike?", 20 km/h":""})`;
    map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});
  }catch(e){
    routeInfo = "Itinéraire indisponible : distances estimées affichées."; map.setView([o.lat,o.lon],13);
  }
  showRouteInfo();
}
let triage = {};
try { triage = JSON.parse(localStorage.getItem("triage")||"{}"); } catch(e) {}
function setTriage(lien, v){ triage[lien] = triage[lien]===v ? undefined : v;
  try { localStorage.setItem("triage", JSON.stringify(triage)); } catch(e) {} render(); }
const REPO = location.hostname.endsWith("github.io")
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}` : "edouard-lopez/job-local-search";
const WF = f => `https://github.com/${REPO}/actions/workflows/${f}`;
const ORX = [43.6036, -1.3767];
const cat = c => /CDI/i.test(c) ? "CDI" : /CDD/i.test(c) ? "CDD" : /intérim/i.test(c) ? "Intérim" :
  /fonction/i.test(c) ? "Fonction publique" : /freelance/i.test(c) ? "Freelance" : /altern|apprent/i.test(c) ? "Alternance" : "Autre";
const state = {contrat:new Set(), tech:new Set()};
const map = L.map("map").setView([43.5,-1.3], 9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© contributeurs OpenStreetMap"}).addTo(map);
L.circleMarker(ORX,{radius:8,color:"#c0392b",fillOpacity:.9}).addTo(map).bindTooltip("Orx (domicile)");
const markers = OFFRES.map(o => L.marker([o.lat,o.lon]).bindPopup(
  `<b>${o.poste}</b><br>${o.entite}<br>${o.commune} · ${o.contrat}<br>🚲 ~${o.velo_min} min · 🚗 ~${o.voiture_min} min<br><a href="${o.lien}" target="_blank" rel="noopener">Annonce</a>`));
function chips(el, values, set, counts){
  values.forEach(v=>{const b=document.createElement("button");b.className="chip"+(el.id==="fTech"?" "+kcls(v):"");b.textContent=`${v} (${counts[v]})`;b.setAttribute("aria-pressed","false");
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.setAttribute("aria-pressed",set.has(v));render();};el.appendChild(b);});
}
const contratCount={};OFFRES.forEach(o=>{const c=cat(o.contrat);contratCount[c]=(contratCount[c]||0)+1;});
chips(fContrat,Object.keys(contratCount).sort(),state.contrat,contratCount);
const techCount={};OFFRES.forEach(o=>o.technos.forEach(t=>techCount[t]=(techCount[t]||0)+1));
chips(fTech,sortTech(Object.keys(techCount)),state.tech,techCount);
fZone.onchange=render; map.on("moveend",render);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const bounds=map.getBounds(); const shown=[];
  OFFRES.forEach((o,i)=>{
    const ok=(!state.contrat.size||state.contrat.has(cat(o.contrat)))
      &&(!state.tech.size||o.technos.some(t=>state.tech.has(t)))
      &&!(fZone.checked&&o.zone.startsWith("Lasseube"));
    ok?markers[i].addTo(map):markers[i].remove();
    if(ok&&bounds.contains([o.lat,o.lon]))shown.push(o);
  });
  shown.sort((a,b)=>String(b.publie||"").localeCompare(String(a.publie||"")));
  count.textContent=`${shown.length} offre(s) dans la zone visible`;
  list.innerHTML=shown.map(o=>{const t=triage[o.lien];const ent=o.entite.split(/\s+/);const short=ent.length>3?ent.slice(0,3).join(" ")+"…":o.entite;
  return `<article class="card${t?" "+t:""}${o.id===focused?" focused":""}" data-id="${o.id}">
    <div class="head"><div class="titles">
    <h3>${t==="dig"?'<span class="star">★</span> ':""}<a href="${o.lien}" target="_blank" rel="noopener">${esc(o.poste)}</a> <span class="date">· ${esc(o.publie)}</span></h3>
    <div class="meta">${ent.length>3?`<abbr title="${esc(o.entite)}">${esc(short)}</abbr>`:esc(o.entite)} · ${esc(o.commune)} · ${esc(o.secteur)} · <b>${esc(o.contrat)}</b></div></div>
    <div class="acts">
      <button class="ico" data-l="${esc(o.lien)}" data-v="dig" aria-pressed="${t==="dig"}" title="Marquer À creuser" aria-label="Marquer À creuser">⭐</button>
      <button class="ico" data-l="${esc(o.lien)}" data-v="out" aria-pressed="${t==="out"}" title="Marquer comme exclue" aria-label="Marquer comme exclue">❌</button>
      <a class="ico" href="${WF("generate-application.yml")}" target="_blank" rel="noopener" title="Générer un CV personnalisé (markdown) : offre n° ${o.id}" aria-label="Générer un CV personnalisé">📝</a>
    </div></div>
    <div class="scores"><span>Techno <b>${o.score_techno}/5</b></span><span>Libre <b>${o.score_libre}/5</b></span>
      <span>🚲 ~${o.velo_min} min</span><span>🚗 ~${o.voiture_min} min</span><span>${o.distance_km} km</span></div>
    <details><summary>Mission</summary><p>${esc(o.mission)}</p></details>
    <div class="tech">${sortTech(o.technos).map(t=>`<span class="${kcls(t)}">${esc(t)}</span>`).join("")}</div>
    ${o.email||o.telephone?`<div class="meta" style="margin-top:6px">${esc(o.email||"")}${o.email&&o.telephone?" · ":""}${esc(o.telephone||"")}</div>`:""}
    <div class="route" hidden></div>
  </article>`}).join("");
  list.querySelectorAll("button.ico").forEach(b=>b.onclick=e=>{e.stopPropagation();setTriage(b.dataset.l,b.dataset.v);});
  list.querySelectorAll(".card").forEach(c=>c.onclick=e=>{if(e.target.closest("a,button,summary"))return;focusOffer(+c.dataset.id);});
  if(focused)showRouteInfo();
}
btnUpdate.href=WF("update-offers.yml");
render();
</script>
</body>
</html>
