name: Publier la carte
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/build.py
      - run: mkdir _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/upload-pages-artifact@v4
      - id: deploy
        uses: actions/deploy-pages@v4
