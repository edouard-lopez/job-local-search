<style>
:root{--bg:#fff;--fg:#1d2329;--mut:#5b6670;--line:#dde2e6;--acc:#1f6f5c;--chip:#eef3f1}
@media (prefers-color-scheme:dark){:root{--bg:#15191c;--fg:#e6eaed;--mut:#9aa6b0;--line:#2c3439;--acc:#5cc3a6;--chip:#1f2a27}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 4px}
header p{margin:0;color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:minmax(320px,42%) 1fr;height:calc(100vh - 64px)}
#map{height:100%;min-height:320px}
#side{overflow:auto;padding:12px 16px;border-left:1px solid var(--line)}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
label.b{font-weight:600;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.count{color:var(--mut);margin:6px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:15px}
.meta{color:var(--mut);font-size:12.5px}
.scores{display:flex;gap:10px;margin:6px 0;font-size:12.5px}
.scores b{color:var(--acc)}
details summary{cursor:pointer;color:var(--acc)}
a{color:var(--acc)}
.tech{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tech span{background:var(--chip);border-radius:4px;padding:1px 6px;font-size:11.5px}
.wrap{overflow-x:auto}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}#map{height:55vh}#side{border-left:0}}
</style>
</head>
