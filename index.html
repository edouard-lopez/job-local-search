async function focusOffer(id){

  try{
    const prof = bike ? "routed-bike" : "routed-car";
    const r = await fetch(`https://routing.openstreetmap.de/${prof}/route/v1/driving/${ORX[1]},${ORX[0]};${o.lon},${o.lat}?overview=full&geometries=geojson`);
    const j = await r.json(); const rt = j.routes[0];
    routeLayer = L.geoJSON(rt.geometry,{style:{color:bike?"#16a34a":"#2563eb",weight:5,opacity:.8}}).addTo(map);
    const km = rt.distance/1000, min = bike ? km/20*60 : rt.duration/60;
    routeInfo = `${bike?"Vélo":"Voiture"} : ${km.toFixed(1)} km, ~${Math.round(min)} min (itinéraire OpenStreetMap${bike?", 20 km/h":""})`;
    map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});
  }catch(e){

}

const REPO = location.hostname.endsWith("github.io")
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}` : "edouard-lopez/job-local-search";
const WF = f => `https://github.com/${REPO}/actions/workflows/${f}`;
const ORX = [43.6036, -1.3767];
const cat = c => /CDI/i.test(c) ? "CDI" : /CDD/i.test(c) ? "CDD" : /intérim/i.test(c) ? "Intérim" :
  /fonction/i.test(c) ? "Fonction publique" : /freelance/i.test(c) ? "Freelance" : /altern|apprent/i.test(c) ? "Alternance" : "Autre";
const state = {contrat:new Set(), tech:new Set()};
const map = L.map("map").setView([43.5,-1.3], 9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© contributeurs OpenStreetMap"}).addTo(map);
L.circleMarker(ORX,{radius:8,color:"#c0392b",fillOpacity:.9}).addTo(map).bindTooltip("Orx (domicile)");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const markers = OFFRES.map(o => L.marker([o.lat,o.lon]).bindPopup(
  `<b>${esc(o.poste)}</b><br>${esc(o.entite)}<br>${esc(o.commune)} · ${esc(o.contrat)}<br><a href="${o.lien}" target="_blank" rel="noopener">Annonce</a>`));
function chips(el, values, set, counts, tech){
  values.forEach(v=>{const b=document.createElement("button");
    b.className="chip "+(tech?kcls(v):"known");b.textContent=`${v} (${counts[v]})`;b.setAttribute("aria-label",`${v}, ${counts[v]} offre(s)${tech?(isKnown(v)?", déjà utilisée":", inconnue"):""}`);b.setAttribute("aria-pressed","false");
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.setAttribute("aria-pressed",set.has(v));render();};el.appendChild(b);});
}
const contratCount={};OFFRES.forEach(o=>{const c=cat(o.contrat);contratCount[c]=(contratCount[c]||0)+1;});
chips(fContrat,Object.keys(contratCount).sort(),state.contrat,contratCount,false);
const techCount={};OFFRES.forEach(o=>o.technos.forEach(t=>techCount[t]=(techCount[t]||0)+1));
chips(fTech,sortTech(Object.keys(techCount)),state.tech,techCount,true);
fZone.onchange=render; map.on("moveend",render);
const hl = (ok, v) => ok ? `<strong class="font-semibold text-emerald-700 dark:text-emerald-400">${v}</strong>` : v;
function card(o){
  const t=triage[o.lien], dig=t==="dig", out=t==="out";
  const ent=o.entite.split(/\s+/), short=ent.length>3?ent.slice(0,3).join(" ")+"…":o.entite;
  const L_=esc(o.lien), name=esc(o.poste);
  const starBtn = `<button class="ico" data-l="${L_}" data-v="dig" title="Marquer À creuser" aria-label="Marquer « ${name} » À creuser">${ICON.star}</button>`;
  const penBtn  = `<a class="ico" href="${WF("generate-application.yml")}" target="_blank" rel="noopener" title="Générer un CV personnalisé (markdown) : offre n° ${o.id}" aria-label="Générer un CV personnalisé pour « ${name} », offre n° ${o.id} (ouvre GitHub)">${ICON.pen}</a>`;
  const xLabel  = dig ? "Retirer de À creuser" : "Marquer comme exclue";
  const xBtn    = `<button class="ico absolute bottom-2 right-2" data-l="${L_}" data-v="out" title="${xLabel}" aria-label="${xLabel} : « ${name} »">${ICON.x}</button>`;
  const status  = dig ? "À creuser. " : out ? "Exclue. " : "";
  return `<article data-id="${o.id}" tabindex="0" aria-label="${status}${name}, ${esc(o.entite)}, ${esc(o.commune)}. Entrée : voir l'itinéraire."
      class="relative cursor-pointer rounded-lg border border-gray-200 dark:border-gray-800 px-3 py-2.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600
      ${dig?"border-l-4 border-l-blue-600":""} ${out?"opacity-50 py-1.5":""} ${o.id===focused?"ring-2 ring-emerald-600":""}">
    <div class="flex items-start gap-2">
      <div class="flex-1 min-w-0">
        <h3 class="text-[15px] font-semibold leading-snug">
          ${dig?`<span class="text-blue-600" aria-hidden="true">★</span><span class="sr-only">À creuser : </span> `:""}${out?`<span class="sr-only">Exclue : </span>`:""}<a class="text-emerald-800 underline decoration-emerald-600/60 decoration-2 underline-offset-2 hover:text-emerald-600 hover:decoration-emerald-600 dark:text-emerald-300" href="${o.lien}" target="_blank" rel="noopener">${name}<span class="sr-only"> (annonce, nouvel onglet)</span></a>
          <span class="whitespace-nowrap text-xs font-normal text-gray-500"><span aria-hidden="true">· </span><span class="sr-only">publiée le </span><time datetime="${esc(o.publie)}">${esc(o.publie)}</time></span>
        </h3>
        <div class="text-[12.5px] text-gray-500">${ent.length>3?`<abbr class="cursor-help" title="${esc(o.entite)}" aria-hidden="true">${esc(short)}</abbr><span class="sr-only">${esc(o.entite)}</span>`:esc(o.entite)} · ${esc(o.commune)} · ${esc(o.secteur)} · <b class="text-gray-700 dark:text-gray-300">${esc(o.contrat)}</b></div>
      </div>
      <div class="shrink-0">${dig?penBtn:starBtn}</div>
    </div>
    ${out?"":`
    <ul class="flex flex-wrap items-center gap-x-3 my-1.5 text-[12.5px]">
      <li class="inline-flex items-center gap-1" title="Score techno"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.code}</span><span class="sr-only">Score techno :</span> ${hl(o.score_techno>=3, `${o.score_techno}/5`)}</li>
      <li class="inline-flex items-center gap-1" title="Score logiciel libre"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.fork}</span><span class="sr-only">Score logiciel libre :</span> ${hl(o.score_libre>=3, `${o.score_libre}/5`)}</li>
      <li class="inline-flex items-center gap-1" title="Vélo"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.bike}</span><span class="sr-only">Vélo :</span> ${hl(o.velo_min<30, `~${o.velo_min} min`)}</li>
      <li class="inline-flex items-center gap-1" title="Voiture"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.car}</span><span class="sr-only">Voiture :</span> ${hl(o.voiture_min<30, `~${o.voiture_min} min`)}</li>
      <li class="inline-flex items-center gap-1" title="Distance"><span class="[&>svg]:h-4 [&>svg]:w-4">${ICON.ruler}</span><span class="sr-only">Distance :</span> ${o.distance_km} km</li>
    </ul>
    <details><summary class="cursor-pointer text-emerald-700 dark:text-emerald-400">Mission</summary><p class="mt-1">${esc(o.mission)}</p></details>
    <h4 class="sr-only">Technos</h4>
    <ul class="flex flex-wrap gap-1 mt-1.5 pr-10">${sortTech(o.technos).map(t=>`<li class="tag ${kcls(t)}">${esc(t)}<span class="sr-only">${isKnown(t)?" (déjà utilisée)":" (inconnue)"}</span></li>`).join("")}</ul>
    ${o.email||o.telephone?`<div class="text-[12.5px] text-gray-500 mt-1.5">${esc(o.email||"")}${o.email&&o.telephone?" · ":""}${esc(o.telephone||"")}</div>`:""}
    <div class="route text-[12.5px] text-emerald-700 dark:text-emerald-400 mt-1.5 pr-10" role="status" aria-live="polite" hidden></div>
    ${xBtn}`}
  </article>`;
}
function render(){
  const bounds=map.getBounds(); const shown=[];
  OFFRES.forEach((o,i)=>{
    const ok=(!state.contrat.size||state.contrat.has(cat(o.contrat)))
      &&(!state.tech.size||o.technos.some(t=>state.tech.has(t)))
      &&!(fZone.checked&&o.zone.startsWith("Lasseube"));
    ok?markers[i].addTo(map):markers[i].remove();
    if(ok&&bounds.contains([o.lat,o.lon]))shown.push(o);
  });
  shown.sort((a,b)=>String(b.publie||"").localeCompare(String(a.publie||"")));
  count.textContent=`${shown.length} offre(s) dans la zone visible`;
  list.innerHTML=shown.map(o=>`<li>${card(o)}</li>`).join("");
  list.querySelectorAll("button[data-v]").forEach(b=>b.onclick=e=>{e.stopPropagation();setTriage(b.dataset.l,b.dataset.v);});
  list.querySelectorAll("article").forEach(c=>{
    c.onclick=e=>{if(e.target.closest("a,button,summary,abbr"))return;focusOffer(+c.dataset.id);};
    c.onkeydown=e=>{if(e.target===c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();focusOffer(+c.dataset.id);}};
  });
  if(focused){const f=list.querySelector(`article[data-id="${focused}"]`); if(f&&document.activeElement?.tagName!=="BUTTON") f.focus({preventScroll:true});}
  if(focused)showRouteInfo();
}
btnUpdate.href=WF("update-offers.yml");
render();
</script>
</body>
</html>
